<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="hsl(160,55%,10%)"/>

  <!-- Optical margin line (faint vertical) -->
  <line x1="16" y1="8" x2="16" y2="56" stroke="#f0ece3" stroke-width="0.75" opacity="0.2"/>

  <!-- Text lines aligned to margin -->
  <rect x="16" y="10" width="39" height="7" rx="3.5" fill="#f0ece3"/>
  <!-- Hanging punctuation: small pill hanging left of margin on line 1 -->
  <rect x="9"  y="10" width="5"  height="7" rx="2.5" fill="#f0ece3" opacity="0.55"/>

  <rect x="16" y="23" width="29" height="7" rx="3.5" fill="#f0ece3" opacity="0.8"/>

  <rect x="16" y="36" width="39" height="7" rx="3.5" fill="#f0ece3"/>
  <!-- Hanging punctuation on line 3 -->
  <rect x="9"  y="36" width="5"  height="7" rx="2.5" fill="#f0ece3" opacity="0.55"/>

  <rect x="16" y="49" width="22" height="7" rx="3.5" fill="#f0ece3" opacity="0.75"/>
</svg>
